[project]
name = "discord-hvz"
version = "0.4.0"
description = "A run-yourself Discord bot to manage Humans vs. Zombies games."
authors = [{ name = "ConnerHAnderson", email = "conneranderson.dev@gmail.com" }]
requires-python = ">=3.10,<3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "py-cord>=2.8.1,<3",
    "SQLAlchemy>=1.4.32,<2",
    "loguru>=0.7.3,<0.8",
    "google-api-python-client>=2.200.0,<3",
    "google-auth-httplib2>=0.4.2,<0.5",
    "google-auth-oauthlib>=1.4.1,<2",
    "regex>=2026.9.3,<2027",
    "python-dotenv>=1.2.3,<2",
    "pandas==2.1.4",
    "pydantic-yaml>=1.7.0,<2",
    "pydantic>=2.5.3,<3",
    "tzdata>=2026.3",
    "quickchart-io>=3.0.0,<4",
    "requests>=2.34.2,<3",
]

[project.scripts]
discord_hvz = "discord_hvz:main"
main = "discord_hvz:main"
display = "discord_hvz:display"

[dependency-groups]
dev = [
    "radon>=6.0.1,<7",
    "line-profiler>=3.5.1,<4",
    "pyinstaller>=5.6.2,<6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
